<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --google-blue: #1a73e8;
            --google-gray: #5f6368;
            --border-color: #dadce0;
        }
        * {
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
            transition: background-color 0.2s, border-color 0.2s;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f4f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 40px;
            width: 450px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .google-logo {
            width: 75px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            margin: 0 0 8px 0;
            color: #202124;
        }
        p.subtitle {
            font-size: 16px;
            color: var(--google-gray);
            margin: 0 0 32px 0;
        }
        .account-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        .account-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
        }
        .account-item:hover {
            background-color: #f7f9fa;
            border-color: #accbee;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--google-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 16px;
            margin-right: 12px;
        }
        .avatar.red { background-color: #ea4335; }
        .avatar.green { background-color: #34a853; }
        .avatar.yellow { background-color: #fbbc05; }
        .account-info {
            display: flex;
            flex-direction: column;
        }
        .account-name {
            font-weight: 500;
            font-size: 14px;
            color: #3c4043;
        }
        .account-email {
            font-size: 12px;
            color: var(--google-gray);
        }
        .divider {
            margin: 20px 0;
            font-size: 12px;
            color: var(--google-gray);
            display: flex;
            align-items: center;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: var(--border-color);
            margin: 0 10px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 12px;
            font-weight: 500;
            color: var(--google-gray);
        }
        input {
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            border-color: var(--google-blue);
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }
        .submit-btn {
            background-color: var(--google-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #1557b0;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Google Identity Logo -->
    <svg class="google-logo" viewBox="0 0 24 24" width="75" height="30" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
    </svg>
    
    <h1>Choose an account</h1>
    <p class="subtitle">to continue to AeroQueue</p>
    
    <div class="account-list">
        <div class="account-item" onclick="selectAccount('John', 'Doe', 'john.doe@gmail.com', 'blue')">
            <div class="avatar">J</div>
            <div class="account-info">
                <span class="account-name">John Doe</span>
                <span class="account-email">john.doe@gmail.com</span>
            </div>
        </div>
        
        <div class="account-item" onclick="selectAccount('Jane', 'Smith', 'jane.smith@gmail.com', 'red')">
            <div class="avatar red">J</div>
            <div class="account-info">
                <span class="account-name">Jane Smith</span>
                <span class="account-email">jane.smith@gmail.com</span>
            </div>
        </div>
    </div>
    
    <div class="divider">or use another account</div>
    
    <form id="customGoogleForm" onsubmit="handleCustomSubmit(event)">
        <div class="input-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="e.g. Robert" required>
        </div>
        <div class="input-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="e.g. Miller" required>
        </div>
        <div class="input-group">
            <label for="email">Google Email Address</label>
            <input type="email" id="email" placeholder="e.g. robert.miller@gmail.com" required>
        </div>
        <button type="submit" class="submit-btn">Continue</button>
    </form>
</div>

<script>
    function selectAccount(firstName, lastName, email) {
        if (window.opener) {
            window.opener.postMessage({
                type: 'GOOGLE_AUTH_SUCCESS',
                user: { firstName, lastName, email }
            }, window.location.origin);
            window.close();
        }
    }

    function handleCustomSubmit(e) {
        e.preventDefault();
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        
        if (firstName && lastName && email) {
            selectAccount(firstName, lastName, email);
        }
    }
</script>

</body>
</html>
