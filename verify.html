<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | AeroQueue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #7c3aed;
            --card-bg: rgba(255,255,255,0.96);
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #dbeafe, #f8fbff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .verify-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 { margin-bottom: 10px; font-size: 1.8rem; }
        p { color: var(--text-muted); margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 18px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 8px;
            margin-bottom: 25px;
            outline: none;
        }
        input:focus { border-color: var(--primary); }
        .btn-verify {
            width: 100%;
            padding: 18px;
            background: linear-gradient(to right, #10b981, #059669); /* Green gradient */
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-verify:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body>

<div class="verify-card">
    <h2>Enter OTP</h2>
    <p>A 6-digit code was sent to your email for security.</p>
    
    <!-- This now leads to the success page -->
    <form action="success.html">
        <input type="text" maxlength="6" placeholder="000000" required pattern="\d{6}">
        <button type="submit" class="btn-verify">VERIFY & CANCEL</button>
    </form>
</div>

</body>
</html>
